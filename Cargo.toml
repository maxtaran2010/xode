[workspace]
resolver = "2"
members = ["crates/xode-core", "crates/xode-tools", "crates/xode-index", "crates/xode-db", "crates/xode-kb", "crates/xode-net", "crates/xode-engine", "crates/xode-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
xode-core = { path = "crates/xode-core" }
xode-tools = { path = "crates/xode-tools" }
xode-engine = { path = "crates/xode-engine" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
once_cell = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
